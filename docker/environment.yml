# Conda environment matching the locally-verified `drifting` env.
# The torch stack comes from the pytorch channel (cu130 builds); everything else
# is either in pkgs/main or installed via pip in the `pip:` section.
name: drifting
channels:
  - pytorch
  - defaults
dependencies:
  - python=3.12
  - pytorch=2.11.0
  - torchvision=0.26.0
  - numpy=2.5.2
  - scipy=1.18.1
  - pyyaml=6.0.3
  - pillow=12.2.0
  - tqdm=4.70.0
  - msgpack-python=1.2.1
  - matplotlib=3.11.0
  - pip
  - pip:
      # exact pins from `pip freeze` on the verified env
      - absl-py==2.5.0
      - accelerate==1.15.0
      - annotated-types==0.8.0
      - anyio==4.15.1
      - certifi==2026.7.22
      - charset-normalizer==3.5.1
      - click==8.5.0
      - diffusers==0.39.0
      - einops==0.8.2
      - filelock==3.32.6
