      - h11==0.16.0
      - hf-xet==1.6.0
      - httpcore==1.0.9
      - httpx==0.28.1
      - huggingface-hub==0.36.2
      - idna==3.19
      - importlib-metadata==9.0.1
      - iniconfig==2.3.0
      - jinja2==3.1.6
      - lightning-utilities==0.15.3
